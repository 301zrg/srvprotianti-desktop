name: Windows desktop

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check pages and TypeScript
        run: npm run check
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test Rust behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build desktop application
        run: npm run build
      - name: Prepare portable files
        run: npm run package:portable
      - name: Create Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path release-portable/* -DestinationPath srvprotianti-desktop-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: srvprotianti-desktop-windows-x64
          path: srvprotianti-desktop-windows-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version" -or $version -ne $tauriVersion -or $version -ne $cargoVersion) { throw "Tag and application versions differ" }
      - uses: actions/download-artifact@v4
        with:
          name: srvprotianti-desktop-windows-x64
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME srvprotianti-desktop-windows-x64.zip --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
