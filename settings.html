<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>706 天梯助手 设置</title>
<link rel="stylesheet" href="/assets/common.css">
<style>
  .settings-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:18px; margin:18px 0; }
  .settings-card { background:#1d2a38; border:1px solid #2f4559; border-radius:8px; padding:18px; }
  .settings-card h2 { margin-top:0; }
  .settings-card label { display:block; margin:12px 0; }
  .settings-card input { display:block; box-sizing:border-box; width:100%; margin-top:5px; padding:9px; background:#243447; color:#dce6f0; border:1px solid #47627d; border-radius:4px; }
  .settings-card button { margin:5px 8px 5px 0; padding:8px 13px; background:#2f5c86; color:white; border:0; border-radius:4px; cursor:pointer; }
  .settings-card button:disabled { opacity:.55; cursor:default; }
  .settings-card p { line-height:1.6; color:#a9bed0; }
  .status { min-height:1.5em; white-space:pre-wrap; }
  .error { color:#ff9b97; }
  .success { color:#91dfb3; }
</style>
</head>
<body>
<div data-site-shell></div>
<div class="settings-grid">
  <section class="settings-card">
    <h2 data-i18n="connection">连接与游戏</h2>
    <label><span data-i18n="nickname">游戏登录串（昵称或昵称$密码）</span>
      <input id="launchName" type="password" autocomplete="off" spellcheck="false">
    </label>
    <button id="showName" type="button" data-i18n="show">显示登录串</button>
    <label><span data-i18n="gameHost">游戏服务器 IPv4 或域名</span><input id="gameHost" autocomplete="off" spellcheck="false"></label>
    <label><span data-i18n="gamePort">游戏服务器端口</span><input id="gamePort" type="number" min="1" max="65535" step="1"></label>
    <label><span data-i18n="apiBaseUrl">网页/API 地址</span><input id="apiBaseUrl" type="url" spellcheck="false"></label>
    <label><span data-i18n="executable">游戏程序文件名（位于同目录）</span><input id="executable" spellcheck="false"></label>
    <button id="save" type="button" data-i18n="save">保存设置</button>
    <button id="reset" type="button" data-i18n="reset">恢复默认设置</button>
    <p id="configStatus" class="status" role="status"></p>
  </section>
  <section class="settings-card" id="scripts">
    <h2 data-i18n="scripts">旧裁定脚本</h2>
    <p data-i18n="scriptHelp">从 301zrg/specials 的 706 目录更新脚本到 expansions/script。游戏运行时先退出游戏，再应用更新。此操作不会改游戏设置或根目录 script。</p>
    <p data-i18n="scriptPriority">若旧裁定仍未生效，请在游戏设置中检查“优先扩展脚本”。脚本更新不能保证所有旧录像都可播放。</p>
    <p id="scriptVersion" class="status"></p>
    <button id="updateScripts" type="button" data-i18n="update">检查并更新</button>
    <button id="restoreScripts" type="button" data-i18n="restore">恢复上次更新</button>
    <p id="scriptStatus" class="status" role="status"></p>
  </section>
</div>
<script src="/assets/site-shell.js"></script>
<script>
const I18N = {

    scripts: '旧裁定脚本', scriptHelp: '从 301zrg/specials 的 706 目录更新脚本到 expansions/script。游戏运行时先退出游戏，再应用更新。此操作不会改游戏设置或根目录 script。',
    scriptPriority: '若旧裁定仍未生效，请在游戏设置中检查“优先扩展脚本”。脚本更新不能保证所有旧录像都可播放。',
    update: '检查并更新', restore: '恢复上次更新', updating: '正在检查并更新……',

  },
  ja: {
    title: '706 ランキング補助 設定', connection: '接続とゲーム', nickname: 'ログイン名（名前または名前$パスワード）',
    show: 'ログイン名を表示', hide: 'ログイン名を隠す', gameHost: 'ゲームサーバー IPv4 またはドメイン',
    gamePort: 'ゲームサーバーポート', apiBaseUrl: 'ウェブ/API アドレス',
    executable: '同じフォルダーのゲーム実行ファイル', save: '保存', reset: '既定値に戻す',
    saved: '保存しました。次の操作から有効です。', resetDone: '既定値に戻しました。',
    scripts: '旧裁定スクリプト', scriptHelp: '301zrg/specials の 706 を expansions/script に更新します。ゲームを終了してから適用してください。ゲーム設定と元の script は変更しません。',
    scriptPriority: '旧裁定が反映されない場合、ゲームの「拡張スクリプト優先」を確認してください。すべての古いリプレイの再生は保証されません。',
    update: '確認して更新', restore: '前回の更新を元に戻す', updating: '確認・更新中…',
    restoring: '復元中…', none: '旧裁定スクリプトは未導入', version: '導入済み：', updatedAt: '前回の更新：',
    updated: '更新しました。', current: '最新版です。ローカルファイルも確認しました。', restored: '前回の更新を復元しました。',
    conflict: '同名のローカルスクリプト、または変更済みのスクリプトがあります。バックアップして上書きしますか？',
    failed: '失敗：'
  },
  en: {
    title: '706 Ladder Assistant Settings', connection: 'Connection and Game', nickname: 'Game login string (name or name$password)',
    show: 'Show login string', hide: 'Hide login string', gameHost: 'Game server IPv4 or hostname',
    gamePort: 'Game server port', apiBaseUrl: 'Web/API address',
    executable: 'Game executable in this folder', save: 'Save settings', reset: 'Restore defaults',
    saved: 'Saved. New settings apply to the next action.', resetDone: 'Defaults restored.',
    scripts: 'Old ruling scripts', scriptHelp: 'Update 706 scripts from 301zrg/specials into expansions/script. Exit the game before applying. Game settings and the original script folder are left alone.',
    scriptPriority: 'If old rulings do not take effect, check “prefer expansion scripts” in the game. Updating scripts cannot guarantee playback of every old replay.',
    update: 'Check and update', restore: 'Undo last update', updating: 'Checking and updating…',
    restoring: 'Restoring…', none: 'Old ruling scripts are not installed', version: 'Installed version: ', updatedAt: 'Last update: ',
    updated: 'Scripts updated.', current: 'Already current; local files verified.', restored: 'Last update restored.',
    conflict: 'Same-name local scripts or edited scripts exist. Back them up and overwrite with the repository version?',
    failed: 'Operation failed: '
  },
  ko: {
    title: '706 랭킹 도우미 설정', connection: '연결 및 게임', nickname: '게임 로그인 문자열 (이름 또는 이름$비밀번호)',
    show: '로그인 문자열 표시', hide: '로그인 문자열 숨기기', gameHost: '게임 서버 IPv4 또는 도메인',
    gamePort: '게임 서버 포트', apiBaseUrl: '웹/API 주소',
    executable: '같은 폴더의 게임 실행 파일', save: '설정 저장', reset: '기본값 복원',
    saved: '저장했습니다. 다음 동작부터 적용됩니다.', resetDone: '기본값을 복원했습니다.',
    scripts: '옛 재정 스크립트', scriptHelp: '301zrg/specials의 706 스크립트를 expansions/script에 갱신합니다. 적용하기 전에 게임을 종료하세요. 게임 설정과 원본 script 폴더는 수정하지 않습니다.',
    scriptPriority: '옛 재정이 적용되지 않으면 게임의 “확장 스크립트 우선” 옵션을 확인하세요. 모든 오래된 리플레이 재생은 보장되지 않습니다.',
    update: '확인 및 업데이트', restore: '마지막 업데이트 복원', updating: '확인 및 업데이트 중…',
    restoring: '복원 중…', none: '옛 재정 스크립트가 설치되지 않았습니다', version: '설치 버전: ', updatedAt: '마지막 업데이트: ',
    updated: '스크립트를 업데이트했습니다.', current: '최신 버전이며 로컬 파일도 확인했습니다.', restored: '마지막 업데이트를 복원했습니다.',
    conflict: '이름이 같은 로컬 스크립트나 수정된 스크립트가 있습니다. 백업한 뒤 저장소 버전으로 덮어쓸까요?',
    failed: '작업 실패: '
  }
};
const conflictMessages = {
  zh: { kept: '未更新：已保留本地脚本。', changed: '下载期间脚本文件发生变化，未覆盖。请检查后重新更新。' },
  ja: { kept: '更新を中止し、ローカルのスクリプトを保持しました。', changed: 'ダウンロード中にスクリプトが変更されました。上書きせずに中止しました。確認して再試行してください。' },
  en: { kept: 'Update cancelled; local scripts were kept.', changed: 'Scripts changed during download. Nothing was overwritten. Check the files and retry.' },
  ko: { kept: '업데이트를 취소하고 로컬 스크립트를 유지했습니다.', changed: '다운로드 중 스크립트가 변경되었습니다. 덮어쓰지 않았습니다. 파일을 확인한 뒤 다시 시도하세요.' }
};
const scriptNetworkMessages = {
  zh: { network: '连接 GitHub 下载脚本失败。可能是本地网络、DNS、代理或 GitHub 临时故障；请检查网络后重试。', rate: 'GitHub 暂时限制请求，请稍后重试。', server: 'GitHub 服务暂时出错，请稍后重试。' },
  ja: { network: 'GitHub からスクリプトを取得できません。ネットワーク、DNS、プロキシ、または GitHub の一時的な障害を確認して再試行してください。', rate: 'GitHub のリクエスト制限です。しばらくしてから再試行してください。', server: 'GitHub で一時的なエラーが発生しました。後で再試行してください。' },
  en: { network: 'Could not download scripts from GitHub. Check your connection, DNS or proxy, then retry; GitHub may also be temporarily unavailable.', rate: 'GitHub is temporarily rate limiting requests. Try again later.', server: 'GitHub returned a temporary server error. Try again later.' },
  ko: { network: 'GitHub에서 스크립트를 다운로드하지 못했습니다. 네트워크, DNS 또는 프록시를 확인한 뒤 다시 시도하세요. GitHub의 일시적인 장애일 수도 있습니다.', rate: 'GitHub 요청 제한이 발생했습니다. 잠시 후 다시 시도하세요.', server: 'GitHub에 일시적인 오류가 발생했습니다. 나중에 다시 시도하세요.' }
};
function scriptError(error) {
  const detail = String(error);
  const messages = scriptNetworkMessages[SrvproWeb.getLanguage()] || scriptNetworkMessages.en;
  if (detail.includes('SCRIPT_NETWORK:')) return messages.network + '\n' + detail;
  if (/SCRIPT_HTTP:(403|429):/.test(detail)) return messages.rate + '\n' + detail;
  if (/SCRIPT_HTTP:5\d\d:/.test(detail)) return messages.server + '\n' + detail;
  return detail;
}
function t(key) { return SrvproWeb.t(I18N, key); }
function conflictMessage(key) { return conflictMessages[SrvproWeb.getLanguage()][key]; }
const desktop = window.SrvproDesktop;
const configStatus = document.getElementById('configStatus');
const scriptStatus = document.getElementById('scriptStatus');
let busy = false;
function setStatus(element, message, failed) {
  element.textContent = message;
  element.className = 'status ' + (failed ? 'error' : 'success');
}
function fill(config) {
  document.getElementById('launchName').value = config.player.launchName;
  document.getElementById('gameHost').value = config.server.gameHost;
  document.getElementById('gamePort').value = config.server.gamePort;
  document.getElementById('apiBaseUrl').value = config.server.apiBaseUrl;
  document.getElementById('executable').value = config.game.executable;
}
async function refreshState() {
  const state = await desktop.scriptState();
  document.getElementById('scriptVersion').textContent = state.commit
    ? t('version') + state.commit + (state.updatedAt ? '\n' + t('updatedAt') + new Date(state.updatedAt * 1000).toLocaleString() : '')
    : t('none');
  document.getElementById('restoreScripts').disabled = !state.canRestore || busy;
}
async function load() {
  try {
    fill(await desktop.settings());
    await refreshState();
  } catch (error) { setStatus(configStatus, t('failed') + error, true); }
}
async function runScriptOperation(operation) {
  if (busy) return;
  busy = true;
  document.getElementById('updateScripts').disabled = true;
  document.getElementById('restoreScripts').disabled = true;
  setStatus(scriptStatus, t(operation === 'update' ? 'updating' : 'restoring'));
  try {
    let result = operation === 'update'
      ? await desktop.updateScripts(false)
      : await desktop.restoreScripts();
    let overwriteApproved = false;
    if (result.status === 'conflict') {
      if (confirm(t('conflict') + '\n' + result.files.join('\n'))) {
        overwriteApproved = true;
        result = await desktop.updateScripts(true);
      }
    }
    if (result.status === 'conflict') {
      setStatus(scriptStatus, conflictMessage(overwriteApproved ? 'changed' : 'kept') + '\n' + result.files.join('\n'), true);
    } else {
      setStatus(scriptStatus, t(result.status === 'current' ? 'current' : operation === 'update' ? 'updated' : 'restored'));
    }
  } catch (error) {
    setStatus(scriptStatus, t('failed') + scriptError(error), true);
  } finally {
    busy = false;
    document.getElementById('updateScripts').disabled = false;
    await refreshState().catch(() => {});
  }
}
document.getElementById('save').onclick = async function () {
  try {
    const config = structuredClone(await desktop.settings());
    config.player.launchName = document.getElementById('launchName').value;
    config.server.gameHost = document.getElementById('gameHost').value;
    config.server.gamePort = Number(document.getElementById('gamePort').value);
    config.server.apiBaseUrl = document.getElementById('apiBaseUrl').value;
    config.game.executable = document.getElementById('executable').value;
    config.ui.language = SrvproWeb.getLanguage();
    fill(await desktop.saveSettings(config));
    setStatus(configStatus, t('saved'));
  } catch (error) { setStatus(configStatus, t('failed') + error, true); }
};
document.getElementById('reset').onclick = async function () {
  try {
    fill(await desktop.resetSettings());
    setStatus(configStatus, t('resetDone'));
  } catch (error) { setStatus(configStatus, t('failed') + error, true); }
};
document.getElementById('showName').onclick = function () {
  const input = document.getElementById('launchName');
  input.type = input.type === 'password' ? 'text' : 'password';
  this.textContent = t(input.type === 'password' ? 'show' : 'hide');
};
document.getElementById('updateScripts').onclick = () => runScriptOperation('update');
document.getElementById('restoreScripts').onclick = () => runScriptOperation('restore');
SrvproWeb.init({ translations: I18N, onLanguageChange: function () {
  document.getElementById('showName').textContent = t(document.getElementById('launchName').type === 'password' ? 'show' : 'hide');
  refreshState().catch(() => {});
} });
desktop.onScriptProgress(progress => {
  if (busy) setStatus(scriptStatus, progress.message || (progress.done + '/' + progress.total));
});
load().then(() => {
  if (new URLSearchParams(location.search).has('update')) runScriptOperation('update');
});
</script>
</body>
</html>
